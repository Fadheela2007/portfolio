     choisir leur prononciation, et les navigateurs pour proposer — ou non —
     une traduction. Un « frontend » anglais sur une interface française
     déclenchait la bannière de traduction de Chrome à chaque ouverture. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Supervision et sécurité du réseau : découverte des équipements, alertes, bande passante et contrôle des accès web." />
    <!-- Le titre s'affiche dans l'onglet, dans les favoris et dans
         l'historique. « frontend » — le nom du dossier de développement —
         y apparaissait sur chaque poste client. -->
    <title>NetSecureManager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
